<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>自動角色卡</title>
<meta name="description" content="D&D 2024 自動角色卡：選職業、種族、背景，其餘自動完成。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 29 9.5v13L16 30 3 22.5v-13z' fill='%235d6770'/%3E%3Cpath d='M16 8l7 12H9z' fill='none' stroke='%23f4f2ee' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body data-view="build">
<header class="top">
	<div class="brand">自動角色卡<small>D&amp;D 2024</small></div>
	<div class="tools">
		<select id="who" aria-label="切換角色"></select>
		<button type="button" data-act="new">新角色</button>
		<details class="more">
			<summary>更多</summary>
			<div class="menu">
				<button type="button" data-act="print" class="print-m">列印</button>
				<button type="button" data-act="share">複製分享連結</button>
				<button type="button" data-act="export">匯出檔案</button>
				<button type="button" data-act="import">匯入檔案</button>
				<button type="button" data-act="dup">複製這個角色</button>
				<button type="button" data-act="del" class="danger">刪除這個角色</button>
			</div>
		</details>
		<button type="button" data-act="print" class="primary">列印</button>
	</div>
	<nav class="tabs"><button type="button" data-act="view" data-v="build">建立</button><button type="button" data-act="view" data-v="sheet">角色紙</button></nav>
</header>
<main>
	<aside id="build" class="build" aria-label="建立角色"></aside>
	<div id="sheet" class="sheet" aria-label="角色紙"></div>
</main>
<dialog id="tip"></dialog>
<div id="toast" role="status"></div>
<input type="file" id="file" accept="application/json,.json" hidden>
<script src="rules.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
